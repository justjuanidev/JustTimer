<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prioridades del día</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tool-light.css" />
</head>
<body class="tool-window priorities-window">
  <div class="drag-bar"><span class="close-btn" id="closeBtn">&times;</span></div>
  <main class="tool-shell priority-shell">
    <header class="tool-header"><div><div class="tool-title" id="priorityTitle">¿Qué tiene que salir sí o sí hoy?</div><div class="habit-subtitle" id="priorityDate"></div></div><div class="priority-header-actions"><input class="tool-input" id="historyDate" type="date" title="Consultar otro día"/><button class="tool-btn primary" id="saveBtn">Listo</button></div></header>
    <section class="priority-layout">
      <aside class="priority-plan">
        <h2>Principales</h2>
        <div id="mainSlots"></div>
        <div class="priority-extra-head"><h2>Adicionales</h2><button class="tool-btn" id="addExtraBtn">+ Agregar</button></div>
        <div id="extraSlots"></div>
      </aside>
      <section class="priority-picker">
        <div class="priority-search-row"><input class="tool-input" id="searchInput" placeholder="Buscar cualquier tarea…" /><select class="tool-select" id="channelFilter"><option value="all">Todos los canales</option></select></div>
        <div class="priority-hint">Elegí primero un proyecto o video. Después vas a ver únicamente sus tareas, con las subtareas debajo.</div>
        <div class="priority-project-browser" id="priorityProjectBrowser"></div>
        <div class="priority-results" id="taskResults"></div>
        <button class="tool-btn priority-create-toggle" id="createToggle">+ Crear nueva tarea real</button>
        <form class="priority-create hidden" id="createForm">
          <input class="tool-input" id="newTaskName" maxlength="160" placeholder="Nombre de la tarea" />
          <select class="tool-select" id="newChannel"></select>
          <select class="tool-select" id="newProject"></select>
          <input class="tool-input" id="newDue" type="date" />
          <button class="tool-btn primary" type="submit">Crear y elegir</button>
        </form>
      </section>
    </section>
  </main>
  <script src="priorities.js"></script>
</body>
</html>
