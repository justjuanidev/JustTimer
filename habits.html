<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tool-light.css" />
</head>
<body class="tool-window habits-window">
  <div class="drag-bar">
    <span class="close-btn" id="closeBtn" title="Cerrar">&times;</span>
  </div>

  <main class="tool-shell habits-shell">
    <header class="tool-header">
      <div>
        <div class="tool-title">Personal</div>
        <div class="habit-subtitle" id="todayLabel">--</div>
      </div>
      <div class="personal-header-actions">
        <div class="personal-switch" role="group" aria-label="Sección personal">
          <button class="personal-switch-btn active" id="habitsModeBtn" type="button">Hábitos</button>
          <button class="personal-switch-btn" id="projectsModeBtn" type="button">Proyectos</button>
        </div>
        <button class="tool-btn primary" id="addHabitBtn" title="Nuevo hábito">+</button>
      </div>
    </header>

    <section class="habit-layout" id="habitsView">
      <section class="habit-panel phase-panel" id="phasePanel">
        <div class="phase-hero" id="phaseHero">
          <div class="phase-greeting" id="phaseGreeting">Buenos dias</div>
          <div class="phase-range" id="phaseRange">--</div>
        </div>
        <div class="habit-warning hidden" id="phaseWarning"></div>
        <div class="habit-list" id="phaseHabitList"></div>
      </section>

      <section class="habit-panel daily-panel" id="dailyPanel">
        <div class="habit-section-head">
          <div>
            <div class="habit-section-title">Habitos del dia</div>
            <div class="habit-subtitle">Sin horario fijo</div>
          </div>
        </div>
        <div class="habit-warning hidden" id="dailyWarning"></div>
        <div class="habit-list" id="dailyHabitList"></div>
      </section>
    </section>

    <section class="personal-projects hidden" id="projectsView">
      <section class="personal-project-section" id="sessionProjectsSection">
        <div class="personal-projects-toolbar">
          <div class="habit-section-title">Proyectos</div>
          <div class="personal-project-actions"><button class="tool-btn" id="toggleArchivedProjects" type="button">Archivados</button><button class="tool-btn primary" id="addSessionProjectBtn" type="button">+ Nuevo proyecto</button></div>
        </div>
        <div class="personal-project-grid" id="sessionProjectGrid"></div>
      </section>
      <section class="personal-project-section" id="miniProjectsSection">
        <div class="personal-projects-toolbar">
          <div class="habit-section-title">Mini proyectos</div>
          <button class="tool-btn primary" id="addMiniProjectBtn" type="button">+</button>
        </div>
        <div class="personal-project-grid" id="personalProjectGrid"></div>
      </section>
      <section class="personal-project-detail hidden" id="personalProjectDetail">
        <button class="personal-project-back" id="backToMiniProjects" type="button">← Todos los proyectos</button>
        <div class="personal-project-hero" id="personalProjectHero"></div>
        <form class="personal-task-add" id="personalTaskForm">
          <input class="tool-input" id="personalTaskName" maxlength="160" placeholder="Agregar una tarea" />
          <input class="tool-input" id="personalTaskDue" type="date" title="Fecha límite" />
          <button class="tool-btn primary" type="submit">Agregar</button>
        </form>
        <div class="personal-task-list" id="personalTaskList"></div>
      </section>
    </section>

    <aside class="habit-detail-panel hidden" id="habitDetail"></aside>
  </main>

  <dialog class="habit-dialog" id="habitFormDialog">
    <form class="habit-form" id="habitForm">
      <div class="review-title" id="habitFormTitle">Nuevo hábito</div>
      <input class="tool-input" id="habitNameInput" maxlength="80" placeholder="Nombre del habito" />
      <select class="tool-select" id="habitTypeSelect">
        <option value="routine">Rutina · hecho, pendiente o justificado</option>
        <option value="development">Desarrollo · racha, progreso y dificultad</option>
      </select>
      <select class="tool-select" id="habitKindSelect">
        <option value="phase">Por momento del dia</option>
        <option value="daily">Del dia</option>
      </select>
      <select class="tool-select" id="habitPhaseSelect">
        <option value="morning">Manana</option>
        <option value="afternoon">Tarde</option>
        <option value="night">Noche</option>
      </select>
      <input class="tool-input" id="habitTargetInput" type="number" min="1" max="20" value="1" placeholder="Veces por dia" />
      <label class="review-label" for="habitReminderTimes">Recordatorios (varias horas, separadas por coma)</label>
      <input class="tool-input" id="habitReminderTimes" placeholder="08:00, 11:30, 18:00" />
      <div class="habit-reminder-presets" id="habitReminderPresets"></div>
      <div class="habit-trigger-options">
        <label class="habit-day"><input type="checkbox" id="habitAppStartReminder" /><span>Al abrir JustTimer</span></label>
        <label class="habit-day"><input type="checkbox" id="habitPhaseStartReminder" /><span>Al comenzar la etapa</span></label>
      </div>
      <label class="habit-day"><input type="checkbox" id="habitPhaseEndReminder" checked /><span>Avisar 15 min antes de cambiar de etapa</span></label>
      <div class="habit-days" id="habitDays"></div>
      <div class="note-actions">
        <button class="tool-btn primary" type="submit">Guardar</button>
        <button class="tool-btn" id="cancelHabitFormBtn" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog class="habit-dialog" id="sessionProjectDialog">
    <form class="habit-form" id="sessionProjectForm">
      <div class="review-title" id="sessionProjectFormTitle">Nuevo proyecto</div>
      <input class="tool-input" id="sessionProjectName" maxlength="100" placeholder="Nombre del proyecto" required />
      <label class="review-label">Fecha de inicio</label>
      <input class="tool-input" id="sessionProjectStartDate" type="date" />
      <label class="review-label">Fecha límite (opcional)</label>
      <input class="tool-input" id="sessionProjectDueDate" type="date" />
      <label class="review-label">Tiempo estimado (horas)</label>
      <input class="tool-input" id="sessionProjectHours" type="number" min="0" max="10000" step="0.5" placeholder="Ej. 40" />
      <div class="note-actions">
        <button class="tool-btn primary" type="submit">Guardar proyecto</button>
        <button class="tool-btn" id="cancelSessionProjectBtn" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog class="habit-dialog" id="miniProjectDialog">
    <form class="habit-form" id="miniProjectForm">
      <div class="review-title">Nuevo proyecto personal</div>
      <input class="tool-input" id="miniProjectName" maxlength="100" placeholder="Nombre del proyecto" required />
      <label class="review-label">Fecha de inicio</label>
      <input class="tool-input" id="miniProjectStartDate" type="date" />
      <label class="review-label">Fecha límite (opcional)</label>
      <input class="tool-input" id="miniProjectDueDate" type="date" />
      <label class="review-label">Mínimo recomendado para un break (minutos)</label>
      <input class="tool-input" id="miniProjectMin" type="number" min="1" max="120" value="10" />
      <div class="note-actions">
        <button class="tool-btn primary" type="submit">Crear proyecto</button>
        <button class="tool-btn" id="cancelMiniProjectBtn" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog class="habit-dialog" id="habitLogDialog">
    <form class="habit-form" id="habitLogForm">
      <div class="review-title" id="habitLogTitle">Completar habito</div>
      <textarea class="tool-textarea" id="habitLogNotes" rows="5" placeholder="Notas"></textarea>
      <div id="habitDifficultyFields">
        <label class="review-label" for="habitDifficulty">cuanto me costo</label>
        <input class="tool-input" id="habitDifficulty" type="range" min="1" max="10" value="5" />
        <div class="energy-readout" id="habitDifficultyReadout">5 / 10</div>
      </div>
      <div class="note-actions">
        <button class="tool-btn primary" type="submit">Guardar</button>
        <button class="tool-btn" id="cancelHabitLogBtn" type="button">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="habits.js"></script>
</body>
</html>
