<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Mini-proyectos</title><link rel="stylesheet" href="styles.css"/><link rel="stylesheet" href="tool-light.css"/></head>
<body class="tool-window"><div class="drag-bar"><span class="close-btn" id="closeBtn">&times;</span></div>
<main class="tool-shell mini-shell">
  <section id="miniLibrary">
    <header class="tool-header"><div><div class="tool-title">Aprovechar este tiempo</div><div class="habit-subtitle">Opcional: descansar también es una buena decisión.</div></div><button class="tool-btn" id="restBtn">Descansar</button></header>
    <div class="mini-hero"><div><small>HASTA LA PRÓXIMA SESIÓN</small><h2 id="availableTime">Calculando…</h2><p id="nextSessionText"></p></div><strong>🌱</strong></div>
    <div class="tasks-view-label">Mini-proyectos</div><section class="mini-grid" id="continueGrid"></section>
    <form class="mini-form" id="miniForm"><input class="tool-input" id="miniName" maxlength="100" placeholder="Nuevo mini-proyecto"/><input class="tool-input" id="miniMin" type="number" min="1" max="120" value="10" title="Mínimo recomendado"/><input class="tool-input mini-icon-input" id="miniIcon" maxlength="12" value="🌱" list="miniEmojiSuggestions" aria-label="Emoji del proyecto" title="Podés escribir o pegar cualquier emoji"/><datalist id="miniEmojiSuggestions"><option value="🌱"></option><option value="🎹"></option><option value="📖"></option><option value="🧠"></option><option value="🎸"></option><option value="🏃"></option><option value="🧹"></option><option value="🎨"></option><option value="💡"></option><option value="🛠️"></option></datalist><button class="tool-btn primary" type="submit">Agregar</button></form>
  </section>
  <section class="mini-timer hidden" id="miniTimer"><div class="habit-subtitle">MINI-PROYECTO</div><h2 id="runningName"></h2><div class="mini-countdown" id="miniCountdown">00:00</div><p id="timerSafety">Finaliza un minuto antes de tu próxima sesión.</p><textarea class="tool-textarea mini-progress-note" id="progressNote" rows="3" placeholder="¿Dónde quedaste? (opcional)"></textarea><button class="tool-btn primary" id="finishMini">Terminar acá</button></section>
</main><script src="mini-projects.js"></script></body></html>
